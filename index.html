<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shift & Schedule Calendar</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      
      /* Shift colors */
      --color-call: #ef4444;
      --bg-call: rgba(239, 68, 68, 0.15);
      
      --color-vac: #10b981;
      --bg-vac: rgba(16, 185, 129, 0.15);
      
      --color-nc: #3b82f6;
      --bg-nc: rgba(59, 130, 246, 0.15);

      --color-eve: #f59e0b;
      --bg-eve: rgba(245, 158, 11, 0.15);

      --color-day: #8b5cf6;
      --bg-day: rgba(139, 92, 246, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px 80px;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 20px;
      text-align: center;
    }

    .period-nav-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 8px;
    }

    .nav-arrow-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      width: 40px;
      height: 40px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.15s ease-in-out;
    }

    .nav-arrow-btn:hover {
      border-color: #64748b;
      background: #334155;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .controls-wrapper {
      position: sticky;
      top: 12px;
      z-index: 100;
      max-width: 1200px;
      margin: 0 auto 32px;
      background: rgba(30, 41, 59, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .palette-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .palette-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-right: 4px;
    }

    .shift-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 2px solid transparent;
      background: #0f172a;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
    }

    .shift-btn .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .shift-btn[data-shift="Call"] .dot { background: var(--color-call); }
    .shift-btn[data-shift="Vac"] .dot  { background: var(--color-vac); }
    .shift-btn[data-shift="NC"] .dot   { background: var(--color-nc); }
    .shift-btn[data-shift="Eve"] .dot  { background: var(--color-eve); }
    .shift-btn[data-shift="Day"] .dot  { background: var(--color-day); }

    .shift-btn.active {
      border-color: #f8fafc;
      box-shadow: 0 0 0 2px rgba(248, 250, 252, 0.2);
      transform: translateY(-1px);
    }

    .stats-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat-pill {
      font-size: 0.8rem;
      background: #0f172a;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .action-btn {
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #1e293b;
      color: var(--text-muted);
      cursor: pointer;
    }

    .action-btn:hover {
      color: #fff;
      border-color: #64748b;
    }

    .calendar-container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }

    .month-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .month-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 12px;
      text-align: center;
      color: #e2e8f0;
    }

    .weekdays-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day-cell {
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      background: #0f172a;
      transition: border-color 0.1s, transform 0.05s;
    }

    .day-cell.empty {
      background: transparent;
      border-color: transparent;
      cursor: default;
    }

    .day-cell:not(.empty):hover {
      border-color: #64748b;
    }

    .day-cell.is-weekend {
      background: #141f36;
    }

    .shift-tag {
      font-size: 0.7rem;
      font-weight: 700;
      text-align: center;
      border-radius: 4px;
      padding: 2px 0;
      line-height: 1;
      letter-spacing: 0.02em;
    }

    .day-cell.shift-Call { background: var(--bg-call); border-color: var(--color-call); }
    .day-cell.shift-Call .shift-tag { background: var(--color-call); color: #fff; }

    .day-cell.shift-Vac  { background: var(--bg-vac); border-color: var(--color-vac); }
    .day-cell.shift-Vac .shift-tag { background: var(--color-vac); color: #fff; }

    .day-cell.shift-NC   { background: var(--bg-nc); border-color: var(--color-nc); }
    .day-cell.shift-NC .shift-tag { background: var(--color-nc); color: #fff; }

    .day-cell.shift-Eve  { background: var(--bg-eve); border-color: var(--color-eve); }
    .day-cell.shift-Eve .shift-tag { background: var(--color-eve); color: #fff; }

    .day-cell.shift-Day  { background: var(--bg-day); border-color: var(--color-day); }
    .day-cell.shift-Day .shift-tag { background: var(--color-day); color: #fff; }

    @media print {
      body { background: #fff; color: #000; padding: 0; }
      .controls-wrapper, .nav-arrow-btn { display: none !important; }
      .calendar-container { grid-template-columns: repeat(2, 1fr); gap: 16px; }
      .month-card { background: #fff; border: 1px solid #ccc; page-break-inside: avoid; }
      .month-title { color: #000; }
      .day-cell { background: #fff; border-color: #ddd; color: #000; }
      .day-cell.shift-Call { border-color: #ef4444; background: #fee2e2; }
      .day-cell.shift-Vac  { border-color: #10b981; background: #d1fae5; }
      .day-cell.shift-NC   { border-color: #3b82f6; background: #dbeafe; }
      .day-cell.shift-Eve  { border-color: #f59e0b; background: #fef3c7; }
      .day-cell.shift-Day  { border-color: #8b5cf6; background: #ede9fe; }
    }
  </style>
</head>
<body>

  <header>
    <div class="period-nav-container">
      <button type="button" class="nav-arrow-btn" id="prevPeriodBtn" title="Previous Period">&#8592;</button>
      <h1 id="calendarHeading">March 2027 – September 2027 Shift Schedule</h1>
      <button type="button" class="nav-arrow-btn" id="nextPeriodBtn" title="Next Period">&#8594;</button>
    </div>
    <p>Select a tool, then tap dates to assign. Tap the same date again to remove it.</p>
  </header>

  <div class="controls-wrapper">
    <div class="palette-group">
      <span class="palette-label">Tool:</span>
      <button type="button" class="shift-btn active" data-shift="Call">
        <span class="dot"></span> Call
      </button>
      <button type="button" class="shift-btn" data-shift="Vac">
        <span class="dot"></span> Vac
      </button>
      <button type="button" class="shift-btn" data-shift="NC">
        <span class="dot"></span> NC
      </button>
      <button type="button" class="shift-btn" data-shift="Eve">
        <span class="dot"></span> Eve
      </button>
      <button type="button" class="shift-btn" data-shift="Day">
        <span class="dot"></span> Day
      </button>
    </div>

    <div class="stats-group">
      <span class="stat-pill">Call: <strong id="count-Call">0</strong></span>
      <span class="stat-pill">Vac: <strong id="count-Vac">0</strong></span>
      <span class="stat-pill">NC: <strong id="count-NC">0</strong></span>
      <span class="stat-pill">Eve: <strong id="count-Eve">0</strong></span>
      <span class="stat-pill">Day: <strong id="count-Day">0</strong></span>
      <button type="button" class="action-btn" id="clearAllBtn" title="Reset all shifts">Reset All</button>
      <button type="button" class="action-btn" onclick="window.print()" title="Print Calendar">Print</button>
    </div>
  </div>

  <main class="calendar-container" id="calendarGrid"></main>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    // 1. PASTE YOUR APPS SCRIPT WEB APP URL HERE
    const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyTYx4tdm-bJ4B47Bri5HDAxB-1WWyOwIu3qcXK7RifHYReQMv4El13XOpMVBVEkAbJ/exec";

    const MONTH_NAMES = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];
    const DAYS_HEADER = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];

    let currentPeriod = {
      startYear: 2027,
      periodIndex: 0
    };

    let currentTool = 'Call';
    let schedule = {};
    let debounceTimer = null;

    // Fetch initial schedule from Google Sheets
    async function fetchRemoteSchedule() {
      try {
        const res = await fetch(GOOGLE_SHEET_API_URL);
        schedule = await res.json();
        renderCalendar();
      } catch (err) {
        console.error("Failed to load from Google Sheets:", err);
      }
    }

    // Push changes back to Google Sheets (debounced to prevent spamming)
    function syncToGoogleSheets() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(async () => {
        try {
          await fetch(GOOGLE_SHEET_API_URL, {
            method: "POST",
            mode: "no-cors", // Google Apps Script requires no-cors for direct cross-origin posts
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(schedule)
          });
        } catch (err) {
          console.error("Failed to sync to Google Sheets:", err);
        }
      }, 600);
    }

    const paletteButtons = document.querySelectorAll('.shift-btn');
    paletteButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        paletteButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTool = btn.dataset.shift;
      });
    });

    function toggleShift(cell) {
      const dateKey = cell.dataset.date;
      if (!dateKey) return;

      if (schedule[dateKey] === currentTool) {
        delete schedule[dateKey];
      } else {
        schedule[dateKey] = currentTool;
      }
      renderCellShift(cell, schedule[dateKey]);
      updateCounters();
      syncToGoogleSheets();
    }

    function renderCellShift(cell, shift) {
      cell.classList.remove('shift-Call', 'shift-Vac', 'shift-NC', 'shift-Eve', 'shift-Day');
      const existingTag = cell.querySelector('.shift-tag');
      if (existingTag) existingTag.remove();

      if (shift) {
        cell.classList.add(`shift-${shift}`);
        const tag = document.createElement('div');
        tag.className = 'shift-tag';
        tag.textContent = shift;
        cell.appendChild(tag);
      }
    }

    function updateCounters() {
      const counts = { 'Call': 0, 'Vac': 0, 'NC': 0, 'Eve': 0, 'Day': 0 };
      Object.values(schedule).forEach(s => {
        if (counts[s] !== undefined) counts[s]++;
      });
      document.getElementById('count-Call').textContent = counts['Call'];
      document.getElementById('count-Vac').textContent = counts['Vac'];
      document.getElementById('count-NC').textContent = counts['NC'];
      document.getElementById('count-Eve').textContent = counts['Eve'];
      document.getElementById('count-Day').textContent = counts['Day'];
    }

    function getCurrentPeriodMonths() {
      const months = [];
      const startMonth = currentPeriod.periodIndex === 0 ? 2 : 8;
      let y = currentPeriod.startYear;

      for (let i = 0; i < 7; i++) {
        let m = startMonth + i;
        let yearForMonth = y;
        if (m > 11) {
          m -= 12;
          yearForMonth = y + 1;
        }
        months.push({
          year: yearForMonth,
          month: m,
          name: `${MONTH_NAMES[m]} ${yearForMonth}`
        });
      }
      return months;
    }

    function renderCalendar() {
      const container = document.getElementById('calendarGrid');
      container.innerHTML = '';

      const months = getCurrentPeriodMonths();
      const first = months[0];
      const last = months[months.length - 1];

      document.getElementById('calendarHeading').textContent = 
        `${first.name.split(' ')[0]} ${first.year} – ${last.name.split(' ')[0]} ${last.year} Shift Schedule`;

      months.forEach(m => {
        const card = document.createElement('div');
        card.className = 'month-card';

        const title = document.createElement('div');
        title.className = 'month-title';
        title.textContent = m.name;
        card.appendChild(title);

        const weekdays = document.createElement('div');
        weekdays.className = 'weekdays-grid';
        DAYS_HEADER.forEach(d => {
          const col = document.createElement('div');
          col.textContent = d;
          weekdays.appendChild(col);
        });
        card.appendChild(weekdays);

        const daysGrid = document.createElement('div');
        daysGrid.className = 'days-grid';

        const firstDayIndex = new Date(m.year, m.month, 1).getDay();
        const daysInMonth = new Date(m.year, m.month + 1, 0).getDate();

        for (let i = 0; i < firstDayIndex; i++) {
          const emptyCell = document.createElement('div');
          emptyCell.className = 'day-cell empty';
          daysGrid.appendChild(emptyCell);
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const cell = document.createElement('div');
          cell.className = 'day-cell';

          const dayOfWeek = (firstDayIndex + day - 1) % 7;
          if (dayOfWeek === 0 || dayOfWeek === 6) {
            cell.classList.add('is-weekend');
          }

          const dateStr = `${m.year}-${String(m.month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          cell.dataset.date = dateStr;

          const dayNum = document.createElement('span');
          dayNum.textContent = day;
          cell.appendChild(dayNum);

          if (schedule[dateStr]) {
            renderCellShift(cell, schedule[dateStr]);
          }

          cell.addEventListener('click', (e) => {
            e.preventDefault();
            toggleShift(cell);
          });

          daysGrid.appendChild(cell);
        }

        card.appendChild(daysGrid);
        container.appendChild(card);
      });

      updateCounters();
    }

    document.getElementById('prevPeriodBtn').addEventListener('click', () => {
      if (currentPeriod.periodIndex === 0) {
        currentPeriod.periodIndex = 1;
        currentPeriod.startYear -= 1;
      } else {
        currentPeriod.periodIndex = 0;
      }
      renderCalendar();
    });

    document.getElementById('nextPeriodBtn').addEventListener('click', () => {
      if (currentPeriod.periodIndex === 0) {
        currentPeriod.periodIndex = 1;
      } else {
        currentPeriod.periodIndex = 0;
        currentPeriod.startYear += 1;
      }
      renderCalendar();
    });

    document.getElementById('clearAllBtn').addEventListener('click', () => {
      if (window.confirm("Are you sure you want to clear all shifts across all months?")) {
        schedule = {};
        renderCalendar();
        syncToGoogleSheets();
      }
    });

    // Initial render and data fetch
    renderCalendar();
    fetchRemoteSchedule();
  });
</script>
</body>
</html>
